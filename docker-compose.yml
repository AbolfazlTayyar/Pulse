# Dev environment (ADR 0005). Examples:
#   docker compose up -d redis
#   docker compose run --rm app lua market.lua fetch BTC,ETH
#   docker compose run --rm app busted
services:
  app:
    build: .
    image: market-app:dev
    working_dir: /app
    volumes:
      - .:/app            # bind mount: edits show up without a rebuild
    environment:
      REDIS_HOST: redis   # required, no default anywhere else (CLAUDE.md: no silent magic host)
      # Cap glibc name lookup at ~1 s: with Redis stopped, "redis" stops resolving and a lookup
      # would otherwise block ~8 s, longer than DEADLINE_MS (luasocket cannot time it out).
      RES_OPTIONS: "timeout:1 attempts:1"
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
